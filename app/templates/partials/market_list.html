<script>
    window.incomingMarketData = {{ cards_json | safe }};
    // INYECCIÓN DE REPETIDAS DEL USUARIO
    window.myDuplicatesData = {{ my_duplicates_json | safe }};
    window.currentUserNick = "{{ user.nick }}";
    document.dispatchEvent(new CustomEvent('data-ready'));
</script>

<div class="animate-fade-in pb-10 relative"
     x-data="marketPagination()"
     @set-market-tab.window="syncTab($event.detail)"
     @data-ready.document="refreshData()"> 
     
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 min-h-[400px]">
        
        <template x-for="card in paginatedCards" :key="card.id">
            
            <div class="relative bg-slate-800 rounded-xl border-2 overflow-hidden transition-all duration-300 hover:-translate-y-1 hover:shadow-xl group"
                 :class="{
                    'border-yellow-500 shadow-[0_0_15px_rgba(234,179,8,0.15)]': !card.is_pending && card.owner.is_premium,
                    'border-indigo-500 shadow-[0_0_15px_rgba(99,102,241,0.25)]': card.is_pending,
                    'border-green-600/50': !card.is_pending && card.is_wishlist && !card.owner.is_premium,
                    'border-slate-700': !card.is_pending && !card.is_wishlist && !card.owner.is_premium
                 }">
                
                <template x-if="!card.is_pending && card.owner.is_premium">
                    <div class="absolute top-0 right-0 bg-gradient-to-l from-yellow-600 to-transparent text-[10px] font-black text-white px-3 py-1 rounded-bl-xl z-10">
                        💎 PREMIUM
                    </div>
                </template>
                <template x-if="card.is_pending">
                    <div class="absolute top-0 right-0 bg-indigo-600 text-[10px] font-black text-white px-3 py-1 rounded-bl-xl z-10 flex items-center gap-1">
                        <span>⏳</span> EN CURSO
                    </div>
                </template>

                <div class="p-3 flex items-center gap-3 bg-slate-900/30 border-b border-slate-700/50">
                    <div class="w-10 h-10 rounded-full flex-shrink-0 flex items-center justify-center font-bold text-slate-900 shadow-md"
                         :class="card.owner.is_premium ? 'bg-gradient-to-br from-yellow-400 to-yellow-600 border border-yellow-200' : 'bg-slate-600 text-gray-200'">
                        <span x-text="card.owner.initial"></span>
                    </div>
                    <div class="min-w-0 flex-1 leading-tight">
                        <div class="flex items-center gap-1">
                            <h4 class="font-bold text-sm text-white truncate" x-text="card.owner.nick"></h4>
                            <template x-if="card.owner.is_premium">
                                <svg class="w-3 h-3 text-blue-400" fill="currentColor" viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>
                            </template>
                        </div>
                        <div class="flex items-center justify-between text-[10px] text-gray-400 mt-0.5">
                            <span class="truncate" x-text="card.owner.province"></span>
                            <template x-if="card.is_pending && card.owner.phone">
                                <span class="text-green-400 font-mono" x-text="card.owner.phone"></span>
                            </template>
                            <template x-if="!card.is_pending">
                                <span class="text-yellow-500 font-bold flex items-center gap-0.5 bg-slate-900 px-1.5 rounded-full border border-slate-700">
                                    ⭐ <span x-text="card.owner.reputation"></span>
                                </span>
                            </template>
                        </div>
                    </div>
                </div>

                <div class="p-4 flex items-stretch justify-between gap-2">
                    <div class="flex-1 flex flex-col items-center justify-center text-center border-r border-slate-700/50 pr-2">
                        <p class="text-[9px] uppercase font-bold text-gray-500 mb-1 tracking-wider">
                            <span x-text="card.is_sale ? 'Vende' : 'Ofrece'"></span>
                        </p>
                        <div class="relative group/num">
                            <div class="text-lg font-black px-3 py-1.5 rounded border shadow-lg transition-transform transform group-hover/num:scale-105"
                                 :class="card.is_wishlist ? 'bg-green-900/40 border-green-500 text-green-400 shadow-green-900/20' : 'bg-slate-900 border-slate-600 text-white'">
                                <span x-text="card.sticker_name"></span>
                            </div>
                        </div>
                        <div class="mt-2">
                            <template x-if="card.is_sale">
                                <span class="text-xs text-green-400 font-bold bg-green-900/20 px-2 py-0.5 rounded border border-green-800" x-text="'$' + card.price"></span>
                            </template>
                            <template x-if="!card.is_sale">
                                <span class="text-[10px] text-blue-300 font-bold bg-blue-900/20 px-2 py-0.5 rounded border border-blue-800">🔄 SOLO CANJE</span>
                            </template>
                        </div>
                    </div>

                    <div class="flex-1 flex flex-col items-center justify-center text-center pl-2">
                        <p class="text-[9px] uppercase font-bold text-gray-500 mb-1 tracking-wider">Te Sirve</p>
                        <template x-if="card.is_pending">
                            <div class="text-indigo-300 text-[10px] font-bold bg-indigo-900/30 px-2 py-1 rounded border border-indigo-500/30">
                                En negociación...
                            </div>
                        </template>
                        <template x-if="!card.is_pending">
                            <div>
                                <template x-if="card.has_match">
                                    <div class="flex flex-col gap-1 w-full">
                                        <template x-for="match in card.matches">
                                            <div class="bg-blue-600/20 border border-blue-500/50 text-blue-200 text-[10px] font-bold px-2 py-1 rounded relative">
                                                <span class="block text-[8px] text-blue-400 uppercase">Vos tenés:</span>
                                                <span x-text="match.name"></span>
                                            </div>
                                        </template>
                                    </div>
                                </template>
                                <template x-if="!card.has_match">
                                    <div class="text-gray-600 text-[10px] italic py-2 px-3 border border-slate-700 rounded border-dashed bg-slate-900/30">
                                        Ver su lista...
                                    </div>
                                </template>
                            </div>
                        </template>
                    </div>
                </div>

                <template x-if="!card.is_pending">
                    <button @click="contactUser(card)" 
                            class="w-full py-3 text-sm font-bold transition-colors border-t border-slate-700 flex justify-center items-center gap-2 cursor-pointer outline-none hover:bg-opacity-90 disabled:opacity-50"
                            :class="(card.has_match && card.is_wishlist) ? 'bg-green-700 hover:bg-green-600 text-white' : 'bg-slate-800 hover:bg-slate-700 text-gray-300 hover:text-white'"
                            :disabled="loadingContact === card.id">
                        
                        <template x-if="loadingContact === card.id">
                            <span class="animate-pulse flex items-center justify-center gap-2">
                                <svg class="animate-spin h-4 w-4 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                                Conectando...
                            </span>
                        </template>

                        <template x-if="loadingContact !== card.id">
                            <div class="flex items-center justify-center gap-2">
                                <template x-if="!card.owner.phone">
                                    <span class="text-xs">🔒</span>
                                </template>
                                <template x-if="card.has_match && card.is_wishlist">
                                    <span>🔥 ¡HAY MATCH! Negociar</span>
                                </template>
                                <template x-if="!(card.has_match && card.is_wishlist) && card.is_wishlist">
                                    <span>💬 Me sirve, Negociar</span>
                                </template>
                                <template x-if="!card.is_wishlist">
                                    <span>💬 Negociar</span>
                                </template>
                            </div>
                        </template>
                    </button>
                </template>

                <template x-if="card.is_pending">
                    <div class="grid grid-cols-2 border-t border-slate-700 divide-x divide-slate-700">
                        <button @click="openWhatsapp(card)" class="bg-green-600 hover:bg-green-500 text-white text-xs font-bold py-3 flex items-center justify-center gap-1 transition">
                            <span>📲</span> WhatsApp
                        </button>
                        <button @click="openTransactionModal(card)" class="bg-slate-800 hover:bg-slate-700 text-gray-300 hover:text-white text-xs font-bold py-3 flex items-center justify-center gap-1 transition">
                            <span>⚙️</span> Opciones
                        </button>
                    </div>
                </template>

            </div>
        </template>
        
        <template x-if="paginatedCards.length === 0">
             <div class="col-span-1 md:col-span-3 flex flex-col items-center justify-center p-12 bg-slate-800/50 rounded-xl border border-slate-700 border-dashed">
                <div class="text-4xl mb-2 grayscale opacity-50">💨</div>
                <p class="text-gray-400">No hay nada por aquí.</p>
                <template x-if="tab === 'pendientes'">
                    <p class="text-xs text-gray-500 mt-2">No tenés negociaciones activas. ¡Buscá figuritas!</p>
                </template>
            </div>
        </template>
    </div>

    <dialog id="transactionModal" class="bg-slate-800 text-white p-6 rounded-xl border border-slate-600 backdrop:bg-slate-900/80 w-full max-w-sm shadow-2xl">
        <div class="flex justify-between items-start mb-4">
            <h3 class="text-lg font-bold flex items-center gap-2">
                <span>⚙️</span> Gestionar Fichaje
            </h3>
            <button onclick="document.getElementById('transactionModal').close()" class="text-gray-400 hover:text-white">✕</button>
        </div>

        <div x-show="currentCard" class="space-y-4">
            <div class="bg-slate-900 p-3 rounded border border-slate-700 text-sm text-gray-300 text-center">
                Figurita: <strong class="text-white" x-text="currentCard?.sticker_name"></strong><br>
                De: <span x-text="currentCard?.owner.nick"></span>
            </div>

            <button @click="actionFairPlay()" 
                    x-show="!currentCard?.rating_given"
                    class="w-full py-2 bg-blue-600 hover:bg-blue-500 rounded font-bold text-sm shadow-lg flex items-center justify-center gap-2">
                <span>⭐</span> Fair Player (+1 Rep)
            </button>
            <div x-show="currentCard?.rating_given" class="w-full py-2 bg-slate-700 text-gray-400 rounded text-xs text-center border border-slate-600">
                ✅ Ya calificaste a este usuario
            </div>

            <div class="border-t border-slate-700 pt-4">
                <h4 class="text-xs font-bold text-green-400 mb-2 uppercase">✅ Fichaje Cerrado</h4>
                
                <label class="block text-[10px] text-gray-400 mb-1">¿Qué entregaste? (Opcional)</label>
                
                <select x-model="selectedGivenStickerNum" 
                        class="w-full bg-slate-900 border border-slate-600 rounded px-3 py-2 text-sm text-white focus:border-green-500 outline-none mb-2">
                    <option value="0">No descontar nada</option>
                    <template x-for="dupe in myDuplicates" :key="dupe.sticker_num">
                        <option :value="dupe.sticker_num" x-text="dupe.name + ' (x' + dupe.qty + ')'"></option>
                    </template>
                </select>
                
                <button @click="actionComplete()" class="w-full py-2 bg-green-700 hover:bg-green-600 rounded font-bold text-sm shadow-lg">
                    Confirmar Intercambio
                </button>
                <p class="text-[9px] text-gray-500 text-center mt-1">Se sumará la figurita a tu álbum.</p>
            </div>

            <div class="border-t border-slate-700 pt-4">
                <button @click="actionCancel()" class="w-full py-2 bg-red-900/50 hover:bg-red-900 text-red-300 hover:text-red-200 border border-red-800 rounded font-bold text-xs shadow-lg">
                    ❌ Fichaje Caído (Cancelar)
                </button>
            </div>
        </div>
    </dialog>

    <div class="mt-6 flex justify-between items-center border-t border-slate-700 pt-4" x-show="totalPages > 1">
        <button @click="prevPage()" :disabled="currentPage === 1" class="px-4 py-2 bg-slate-800 border border-slate-600 rounded text-sm text-white hover:bg-slate-700 disabled:opacity-50 disabled:cursor-not-allowed transition flex items-center gap-2">
            <span>⬅️</span> Anterior
        </button>
        <span class="text-sm text-gray-400">
            Página <span class="font-bold text-white" x-text="currentPage"></span> de <span x-text="totalPages"></span>
        </span>
        <button @click="nextPage()" :disabled="currentPage === totalPages" class="px-4 py-2 bg-slate-800 border border-slate-600 rounded text-sm text-white hover:bg-slate-700 disabled:opacity-50 disabled:cursor-not-allowed transition flex items-center gap-2">
            Siguiente <span>➡️</span>
        </button>
    </div>

    {% include 'components/modals.html' %}
</div>

<script>
    function marketPagination() {
        return {
            allCards: window.incomingMarketData || [],
            myDuplicates: window.myDuplicatesData || [], 
            currentPage: 1,
            itemsPerPage: 9,         
            tab: 'canjes',
            loadingContact: null,
            currentCard: null,      
            selectedGivenStickerNum: 0, 

            init() {
                try {
                    const parent = document.querySelector('[x-data*="currentTab"]');
                    if (parent && parent.__x) {
                        this.tab = Alpine.$data(parent).currentTab;
                    }
                } catch (e) {}
                
                if (window.incomingMarketData && window.incomingMarketData.length > 0) {
                    this.allCards = window.incomingMarketData;
                }
            },
            
            refreshData() {
                this.allCards = window.incomingMarketData || [];
                this.myDuplicates = window.myDuplicatesData || [];
                this.currentPage = 1;
            },
            
            syncTab(newTab) {
                this.tab = newTab;
                this.currentPage = 1;
            },

            // --- GESTIÓN DE MODAL Y ACCIONES ---
            openTransactionModal(card) {
                this.currentCard = card;
                this.selectedGivenStickerNum = 0; 
                document.getElementById('transactionModal').showModal();
            },

            async actionFairPlay() {
                if (!this.currentCard) return;
                try {
                    const res = await fetch(`/market/log/${this.currentCard.log_id}/fairplay`, { method: 'POST' });
                    if (res.ok) {
                        this.currentCard.rating_given = true;
                        alert("¡Reputación enviada! ⭐");
                        // Aquí NO recargamos porque no afecta inventario, solo UI
                    } else {
                        alert("Error al enviar calificación.");
                    }
                } catch (e) { alert("Error de conexión"); }
            },

            async actionComplete() {
                if (!this.currentCard) return;
                try {
                    const res = await fetch(`/market/log/${this.currentCard.log_id}/complete`, {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({ given_sticker_num: parseInt(this.selectedGivenStickerNum) })
                    });

                    if (res.ok) {
                        alert("¡Fichaje completado! 🎉 Se actualizó tu álbum.");
                        // RECARGA OBLIGATORIA para actualizar inventario y selector de repetidas
                        window.location.reload(); 
                    } else {
                        alert("Error al completar la transacción.");
                    }
                } catch (e) { alert("Error de conexión"); }
            },

            async actionCancel() {
                if (!this.currentCard) return;
                if(!confirm("¿Seguro que querés cancelar este fichaje? Desaparecerá de tu lista.")) return;

                try {
                    const res = await fetch(`/market/log/${this.currentCard.log_id}/cancel`, { method: 'POST' });
                    if (res.ok) {
                        // RECARGA OBLIGATORIA para limpiar la lista limpiamente
                        window.location.reload();
                    } else {
                        alert("Error al cancelar.");
                    }
                } catch (e) { alert("Error de conexión"); }
            },

            // --- LÓGICA DE CONTACTO ---
            contactUser(card) {
                if (card.is_pending || card.owner.phone) {
                    this.openWhatsapp(card);
                    return;
                }
                this.executeUnlock(card);
            },

            async executeUnlock(card) {
                this.loadingContact = card.id;
                try {
                    const response = await fetch(`/market/contact/${card.id}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' }
                    });
                    const data = await response.json();

                    if (response.ok && data.phone) {
                        card.owner.phone = data.phone;
                        card.is_pending = true; 
                        this.openWhatsapp(card);
                        // En este caso NO recargamos, solo movemos la tarjeta visualmente
                        // para que la experiencia sea fluida mientras negocia.
                        this.allCards = [...this.allCards];
                    } else if (response.status === 403) {
                        const pModal = document.getElementById('premiumModal');
                        if (pModal) pModal.showModal();
                        else alert(data.message || "Límite diario alcanzado.");
                    } else {
                        alert(data.message || "Error al contactar.");
                    }
                } catch (error) {
                    console.error("Error API:", error);
                    alert("Error de conexión ⚠️");
                } finally {
                    this.loadingContact = null;
                }
            },

            openWhatsapp(card) {
                const link = this.generateWhatsappLink(card);
                window.open(link, '_blank');
            },

           generateWhatsappLink(card) {
                let phone = String(card.owner.phone).replace(/\D/g, '');
                let text = "";
                let deepLink = "";
                
                // 1. GENERAR EL TEXTO DEL MENSAJE
                text += `Hola *${card.owner.nick}*! \uD83D\uDC4B Te vi en Canje AlToque 26.\n\n`;

                if (card.is_sale) {
                    // --- MODO VENTA ---
                    text += `\uD83D\uDCB0 *COMPRA DE FIGURITA*\n`;
                    text += `-----------------------------------\n`; 
                    text += `Ves: *${card.sticker_name}*\n`;
                    text += `Precio: *$${card.price}*\n`;
                    text += `-----------------------------------\n\n`;
                    text += `¿La tenés disponible hoy? \uD83D\uDCB8`;

                    const countryCode = card.sticker_name.split(' ')[0];
                    deepLink = `https://canjealtoque26.com/`;

                } else {
                    // --- MODO CANJE ---
                    text += `\uD83D\uDD04 *PROPUESTA DE CANJE*\n`;
                    text += `-----------------------------------\n`; 
                    text += `\uD83C\uDFAF *Te pido:* ${card.sticker_name}\n`;
                    
                    if (card.has_match && card.matches && card.matches.length > 0) {
                        const myOffer = card.matches[0].name;
                        text += `\uD83D\uDC8E *Te ofrezco:* ${myOffer}\n`;
                    } else {
                        text += `\uD83D\uDC8E *Te ofrezco:* (Varias opciones)\n`;
                    }
                    text += `-----------------------------------\n\n`;
                    text += `¿Te sirve el cambio? \uD83E\uDD14`;

                    // --- CORRECCIÓN AQUÍ ---
                    // Usamos la variable global que definimos arriba.
                    // Si por alguna razón falla, no ponemos filtro de nick.
                    const myNick = window.currentUserNick || "";
                    
                    deepLink = `https://canjealtoque26.com/market?nick=${encodeURIComponent(myNick)}`;
                }

                // 2. AGREGAR EL LINK INTELIGENTE AL FINAL
                text += `\n\n📲 *Ver posibles canjes:* ${deepLink}`;

                return `https://wa.me/${phone}?text=${encodeURIComponent(text)}`;
            },

            get filteredCards() {
                return this.allCards.filter(card => {
                    if (this.tab === 'pendientes') return card.is_pending === true;
                    if (card.is_pending === true) return false;
                    if (this.tab === 'canjes') return !card.is_sale;
                    if (this.tab === 'ventas') return card.is_sale;
                    return true;
                });
            },

            get paginatedCards() {
                const start = (this.currentPage - 1) * this.itemsPerPage;
                const end = start + this.itemsPerPage;
                return this.filteredCards.slice(start, end);
            },

            get totalPages() {
                return Math.ceil(this.filteredCards.length / this.itemsPerPage) || 1;
            },

            nextPage() {
                if (this.currentPage < this.totalPages) {
                    this.currentPage++;
                    document.getElementById('market-results').scrollIntoView({ behavior: 'smooth' });
                }
            },
            prevPage() {
                if (this.currentPage > 1) {
                    this.currentPage--;
                    document.getElementById('market-results').scrollIntoView({ behavior: 'smooth' });
                }
            }
        }
    }
</script>
