<div id="dashboard-stats" 
     class="bg-slate-800 p-4 sm:p-5 rounded-xl border border-slate-700 mb-6 flex flex-col sm:flex-row justify-between items-center shadow-md transition-all duration-300 gap-4 sm:gap-0"
     {% if oob %}hx-swap-oob="true"{% endif %}>
    
    <div class="text-center sm:text-left">
        <h1 class="text-xl sm:text-2xl font-bold text-white flex items-center justify-center sm:justify-start gap-2">
            Mi Álbum <span class="text-sm font-normal text-gray-500 hidden md:inline">| Panel de Control</span>
        </h1>
        <p class="text-xs sm:text-sm text-gray-400 mt-1">Tu progreso en tiempo real.</p>
    </div>
    
    <div class="flex items-center gap-3 sm:gap-6 bg-slate-900/50 px-3 py-2 rounded-lg border border-slate-700 overflow-x-auto">
        
        <div class="text-center min-w-[50px]">
            <span class="block text-lg sm:text-xl font-bold text-green-400 transition-all">{{ stats.tengo }}</span>
            <span class="text-[9px] sm:text-[10px] text-gray-500 tracking-wider font-bold">PEGADAS</span>
        </div>

        <div class="w-px h-8 bg-slate-700"></div>

        <div class="text-center min-w-[50px]">
            <span class="block text-lg sm:text-xl font-bold text-rose-400 transition-all">{{ stats.faltan }}</span>
            <span class="text-[9px] sm:text-[10px] text-gray-500 tracking-wider font-bold">FALTAN</span>
        </div>

        <div class="w-px h-8 bg-slate-700"></div>

        <div class="text-center min-w-[50px]">
            <span class="block text-lg sm:text-xl font-bold text-yellow-400 transition-all">{{ stats.repetidas }}</span>
            <span class="text-[9px] sm:text-[10px] text-gray-500 tracking-wider font-bold">REPES</span>
        </div>

        <div class="w-px h-8 bg-slate-700"></div>

        <div class="text-center min-w-[50px]">
            <span class="block text-lg sm:text-xl font-bold text-blue-400">{{ stats.porcentaje }}%</span>
            <span class="text-[9px] sm:text-[10px] text-gray-500 tracking-wider font-bold">LISTO</span>
        </div>
    </div>
</div>
