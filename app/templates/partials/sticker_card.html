<div id="sticker-{{ num }}"
     {% if force_oob %}hx-swap-oob="true"{% endif %}
     
     hx-post="/sticker/{{ num }}"
     hx-trigger="click delay:400ms" 
     hx-include="#status-{{ num }}"
     hx-swap="none"
     
     x-data="{ 
        localStatus: '{{ status if status else 'falta' }}',
        qty: '{{ item.qty if item and item.qty else '2' }}',
        
        nextState() {
            // Ciclo visual instantáneo
            if (this.localStatus === 'falta') this.localStatus = 'tengo';
            else if (this.localStatus === 'tengo') {
                this.localStatus = 'repetida';
                this.qty = '2'; 
            }
            else if (this.localStatus === 'repetida') this.localStatus = 'wishlist';
            else this.localStatus = 'falta';

            // Chequeo visual de página completa
            if (typeof window.checkPageCompletion === 'function') {
                setTimeout(() => window.checkPageCompletion(), 50);
            }
        }
     }"
     @click="nextState()"
     x-bind:data-status="localStatus"
     data-status="{{ status if status else 'falta' }}"

     class="relative aspect-[3/4] rounded-lg flex items-center justify-center border transition-all cursor-pointer hover:scale-105 select-none"
     :class="{
        'bg-gradient-to-br from-green-600 to-green-800 border-green-500 shadow-[0_0_10px_rgba(34,197,94,0.3)]': localStatus === 'tengo',
        'bg-gradient-to-br from-yellow-600 to-yellow-800 border-yellow-500 shadow-[0_0_10px_rgba(234,179,8,0.3)]': localStatus === 'repetida',
        'bg-slate-700 border-red-500/50 shadow-[0_0_10px_rgba(239,68,68,0.2)]': localStatus === 'wishlist',
        'bg-slate-900 border-slate-700 opacity-60 hover:opacity-100 hover:border-slate-500': localStatus === 'falta'
     }">
    
    <input type="hidden" id="status-{{ num }}" name="target_status" x-model="localStatus">
    
    <span class="text-xl font-bold font-mono"
          :class="localStatus === 'falta' ? 'text-slate-600' : 'text-white drop-shadow-md'">
        {{ local_num if local_num else num }}
    </span>

    <div x-show="localStatus === 'repetida'"
         class="absolute -top-2 -right-2 bg-yellow-500 text-slate-900 text-xs font-bold px-1.5 rounded-full border border-slate-900 z-10"
         x-text="'x' + qty"
         x-cloak>
    </div>

    <div x-show="localStatus === 'wishlist'"
         class="absolute -top-2 -right-2 text-red-500 animate-pulse z-10 text-lg"
         x-cloak>
        ❤️
    </div>
    
    <div class="absolute inset-0 bg-white/5 opacity-0 hover:opacity-10 rounded-lg pointer-events-none"></div>
</div>
