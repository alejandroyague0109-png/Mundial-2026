<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa en Vivo: Coleccionistas del Álbum Mundial 2026 | Canje AlToque</title>
    <meta name="description" content="Descubrí en tiempo real cuántos coleccionistas están intercambiando figuritas en toda Latinoamérica.">
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="text/javascript" src="https://www.gstatic.com/charts/loader.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>
        body { background-color: #0f172a; color: white; }
        .google-visualization-tooltip {
            background-color: #1e293b !important;
            border: 1px solid #334155 !important;
            border-radius: 8px !important;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5) !important;
            color: #f8fafc !important;
            padding: 10px !important;
            pointer-events: none;
        }
        .google-visualization-tooltip-item span { color: #f8fafc !important; font-family: monospace; }
    </style>
</head>
<body class="min-h-screen flex flex-col" x-data="heatmapLogic()">

    <header class="bg-slate-900 border-b border-slate-800 p-4 sticky top-0 z-50 shadow-lg">
        <div class="max-w-7xl mx-auto flex flex-col lg:flex-row items-center justify-between gap-4">
            <a href="/" class="flex items-center gap-3 hover:opacity-80 transition-opacity">
                <span class="text-3xl">🗺️</span>
                <div>
                    <h1 class="text-xl font-black bg-clip-text text-transparent bg-gradient-to-r from-indigo-400 to-purple-500 tracking-tight">
                        Radar Latinoamericano
                    </h1>
                    <h2 class="text-xs text-slate-400">Estadísticas en vivo del Mundial 2026</h2>
                </div>
            </a>

            <div class="flex bg-slate-800 p-1 rounded-lg border border-slate-700 flex-wrap justify-center">
                <button @click="setFilter('users')" 
                        class="px-4 py-2 text-xs font-bold rounded-md transition-all"
                        :class="currentFilter === 'users' ? 'bg-indigo-600 text-white shadow' : 'text-slate-400 hover:text-white'">
                    👥 Coleccionistas
                </button>
                <button @click="setFilter('activity')" 
                        class="px-4 py-2 text-xs font-bold rounded-md transition-all"
                        :class="currentFilter === 'activity' ? 'bg-green-600 text-white shadow' : 'text-slate-400 hover:text-white'">
                    🔥 Figuritas Disponibles
                </button>
                <button @click="setFilter('trades')" 
                        class="px-4 py-2 text-xs font-bold rounded-md transition-all"
                        :class="currentFilter === 'trades' ? 'bg-orange-600 text-white shadow' : 'text-slate-400 hover:text-white'">
                    🔄 Intercambios Realizados
                </button>
            </div>
        </div>
    </header>

    <main class="flex-grow w-full max-w-7xl mx-auto p-4 flex flex-col lg:flex-row gap-6 mt-4">
        
        <aside class="w-full lg:w-1/4 bg-slate-900/80 rounded-2xl border border-slate-800 p-6 shadow-2xl flex flex-col justify-start h-fit">
            <div class="flex items-center gap-3 mb-4">
                <span class="text-2xl" x-text="getLegendEmoji()"></span>
                <h3 class="text-lg font-black text-white leading-tight" x-text="getLegendTitle()"></h3>
            </div>
            
            <p class="text-sm text-slate-400 mb-8" x-text="getLegendDesc()"></p>
            
            <div class="space-y-2 mb-8">
                <div class="text-[10px] uppercase tracking-widest text-slate-500 font-bold mb-1">Intensidad en Mapa</div>
                <div class="h-4 w-full rounded-full" :class="getGradientClass()"></div>
                <div class="flex justify-between text-xs font-bold uppercase tracking-widest text-slate-400 mt-1">
                    <span x-text="getLegendMin()"></span>
                    <span x-text="getLegendMax()"></span>
                </div>
            </div>

            <div class="pt-6 border-t border-slate-800">
                <div class="text-xs text-slate-500 uppercase tracking-widest font-bold mb-1">Total Latinoamérica</div>
                <div class="text-4xl font-black text-transparent bg-clip-text" :class="getTextGradientClass()" x-text="getTotalValue().toLocaleString('es-AR')"></div>
            </div>
        </aside>

        <section class="w-full lg:w-3/4 bg-slate-900/50 rounded-2xl border border-slate-800 shadow-2xl relative overflow-hidden h-[60vh] sm:h-[70vh] flex items-center justify-center">
            <div x-show="loading" class="absolute inset-0 flex items-center justify-center bg-slate-900/80 z-20 backdrop-blur-sm">
                <div class="animate-spin text-4xl">⚽</div>
            </div>
            <div id="regions_div" class="w-full h-full z-0" style="transform: scale(1.4) translateY(-10%); transform-origin: center;"></div>
        </section>

    </main>

    <div class="w-full max-w-7xl mx-auto p-4 mb-10">
        <div class="bg-black/50 border border-red-500/30 rounded-lg p-4 font-mono text-[10px] text-gray-400 break-words">
            <strong class="text-red-400">Scanner Base de Datos (ContactLogs):</strong> 
            {{ debug_info }}
        </div>
    </div>

    <script>
        const backendData = {{ map_data | tojson | safe }};

        function heatmapLogic() {
            return {
                currentFilter: 'users',
                loading: true,
                chart: null,
                
                init() {
                    google.charts.load('current', {
                        'packages':['geochart'],
                        'mapsApiKey': '' 
                    });
                    google.charts.setOnLoadCallback(() => {
                        this.drawMap();
                        this.loading = false;
                        window.addEventListener('resize', () => this.drawMap());
                    });
                },

                setFilter(filterType) {
                    this.currentFilter = filterType;
                    this.drawMap();
                },

                getLegendTitle() {
                    if (this.currentFilter === 'users') return 'Coleccionistas';
                    if (this.currentFilter === 'activity') return 'Figuritas Subidas';
                    return 'Canjes Exitosos';
                },
                getLegendEmoji() {
                    if (this.currentFilter === 'users') return '👥';
                    if (this.currentFilter === 'activity') return '🔥';
                    return '🔄';
                },
                getLegendDesc() {
                    if (this.currentFilter === 'users') return 'Cantidad de usuarios registrados oficialmente buscando intercambios.';
                    if (this.currentFilter === 'activity') return 'Volumen total de repetidas y faltantes cargadas en las Wishlists.';
                    return 'Estimación en vivo de los intercambios concretados gracias a la plataforma.';
                },
                getGradientClass() {
                    if (this.currentFilter === 'users') return 'bg-gradient-to-r from-slate-700 via-indigo-500 to-indigo-400';
                    if (this.currentFilter === 'activity') return 'bg-gradient-to-r from-slate-700 via-emerald-600 to-emerald-400';
                    return 'bg-gradient-to-r from-slate-700 via-orange-600 to-orange-400';
                },
                getTextGradientClass() {
                    if (this.currentFilter === 'users') return 'bg-gradient-to-r from-indigo-400 to-indigo-200';
                    if (this.currentFilter === 'activity') return 'bg-gradient-to-r from-emerald-400 to-emerald-200';
                    return 'bg-gradient-to-r from-orange-400 to-orange-200';
                },
                getLegendMin() {
                    if (this.currentFilter === 'users') return 'Pocos';
                    if (this.currentFilter === 'activity') return 'Baja';
                    return 'Escasos';
                },
                getLegendMax() {
                    if (this.currentFilter === 'users') return 'Muchos';
                    if (this.currentFilter === 'activity') return 'Alta';
                    return 'Masivos';
                },
                getTotalValue() {
                    // BLINDAJE 100% CONTRA NaN
                    let total = 0;
                    for (const stats of Object.values(backendData)) {
                        let val = stats[this.currentFilter];
                        if (typeof val === 'number') {
                            total += val;
                        }
                    }
                    return total;
                },

                drawMap() {
                    const dataArray = [];
                    
                    if(this.currentFilter === 'users') {
                        dataArray.push(['País', 'Usuarios']);
                    } else if (this.currentFilter === 'activity') {
                        dataArray.push(['País', 'Figuritas']);
                    } else {
                        dataArray.push(['País', 'Intercambios']);
                    }

                    for (const [countryCode, stats] of Object.entries(backendData)) {
                        let val = stats[this.currentFilter];
                        // Blindaje de seguridad adicional
                        if (typeof val !== 'number') val = 0;
                        dataArray.push([countryCode, val]);
                    }

                    if(dataArray.length === 1) dataArray.push(['AR', 0]);

                    const data = google.visualization.arrayToDataTable(dataArray);

                    let colorAxis;
                    if (this.currentFilter === 'users') {
                        colorAxis = {colors: ['#1e1b4b', '#4f46e5', '#818cf8']};
                    } else if (this.currentFilter === 'activity') {
                        colorAxis = {colors: ['#064e3b', '#16a34a', '#4ade80']};
                    } else {
                        colorAxis = {colors: ['#7c2d12', '#ea580c', '#fdba74']};
                    }

                    const options = {
                        region: '019',
                        backgroundColor: 'transparent',
                        datalessRegionColor: '#1e293b',
                        defaultColor: '#334155',
                        colorAxis: colorAxis,
                        legend: 'none',
                        tooltip: {isHtml: true}
                    };

                    if (!this.chart) {
                        this.chart = new google.visualization.GeoChart(document.getElementById('regions_div'));
                    }
                    this.chart.draw(data, options);
                }
            }
        }
    </script>
</body>
</html>
