<aside class="w-full md:w-64 bg-slate-900 md:bg-slate-800 rounded-xl md:border border-slate-700 sticky top-0 shadow-xl flex flex-col h-[calc(100vh-120px)] overflow-hidden transition-all duration-300">
    
    <div class="p-5 bg-slate-800 border-b border-slate-700 z-10 flex-shrink-0">
        <div class="flex items-center gap-4 mb-4">
            <div class="w-12 h-12 rounded-full bg-gradient-to-br from-yellow-500 to-yellow-700 flex items-center justify-center text-slate-900 font-extrabold text-xl border-2 border-yellow-400 shadow-lg">
                {{ user.nick[0]|upper }}
            </div>
            <div class="overflow-hidden">
                <h3 class="text-white font-bold text-lg truncate leading-tight">{{ user.nick }}</h3>
                <p class="text-xs text-gray-400 flex items-center gap-1 truncate mt-0.5">
                    📍 {{ user.province }}
                </p>
            </div>
        </div>

        <div class="flex items-center justify-between gap-2 text-xs text-gray-300 mb-4 bg-slate-900/50 p-2 rounded-lg border border-slate-700/50">
            <div class="flex items-center gap-1.5">
                <span>⭐</span> 
                <span class="text-yellow-500 font-bold text-sm">{{ user.reputation }}</span> 
                <span>Reputación</span>
            </div>
            {% if user.is_premium %}
            <div class="font-bold text-yellow-500">PRO 💎</div>
            {% endif %}
        </div>

        <div class="flex gap-2 w-full">
            <button onclick="openModal('quickLoadModal')" class="flex-1 bg-blue-600 hover:bg-blue-500 text-white border border-blue-500 text-sm font-bold py-2.5 rounded-lg transition shadow-lg shadow-blue-900/20 flex justify-center items-center gap-2 active:scale-95">
                <span>⚡</span> Cargar
            </button>
            
            <button onclick="openModal('quickLoadInfoModal')" class="w-12 bg-slate-700 hover:bg-slate-600 text-gray-300 border border-slate-600 font-bold py-2.5 rounded-lg transition flex justify-center items-center active:scale-95">
                ℹ️
            </button>
        </div>
    </div>

    <div class="flex-1 overflow-y-auto custom-scrollbar p-4 space-y-4 bg-slate-900/30">
        
        <div>
            <div class="text-[10px] font-bold text-gray-500 uppercase tracking-wider mb-2 px-1">Tu Cuenta</div>
            <div class="grid grid-cols-2 gap-3">
                
                <button onclick="openModal('profileModal')" class="flex flex-col items-center justify-center p-3 bg-slate-800 hover:bg-slate-700 border border-slate-700 hover:border-slate-600 rounded-xl transition group active:scale-95 h-24">
                    <span class="text-2xl mb-2 group-hover:scale-110 transition-transform">✏️</span>
                    <span class="text-xs font-bold text-gray-300 group-hover:text-white">Editar Perfil</span>
                </button>

                {% if user.is_premium %}
                    <button onclick="openModal('telegramModal')" class="flex flex-col items-center justify-center p-3 bg-slate-800 hover:bg-slate-700 border border-slate-700 hover:border-blue-500/50 rounded-xl transition group active:scale-95 h-24">
                        <span class="text-2xl mb-2 group-hover:scale-110 transition-transform">🔔</span>
                        <span class="text-xs font-bold text-blue-400">Alertas ON</span>
                    </button>
                {% else %}
                    <button onclick="openModal('premiumModal')" class="flex flex-col items-center justify-center p-3 bg-slate-800 hover:bg-slate-700 border border-slate-700 hover:border-yellow-500/50 rounded-xl transition group active:scale-95 h-24 relative overflow-hidden">
                        <div class="absolute top-1 right-1 bg-yellow-500/20 text-yellow-500 text-[9px] px-1.5 rounded font-bold border border-yellow-500/30">PRO</div>
                        <span class="text-2xl mb-2 group-hover:scale-110 transition-transform opacity-50 grayscale group-hover:grayscale-0 group-hover:opacity-100">🔔</span>
                        <span class="text-xs font-bold text-gray-400 group-hover:text-yellow-400">Alertas</span>
                    </button>
                {% endif %}
            </div>
        </div>

        {% if not user.is_premium %}
        <button onclick="openModal('premiumModal')" class="w-full relative group overflow-hidden rounded-xl border border-yellow-600/30 p-4 text-left transition active:scale-95">
            <div class="absolute inset-0 bg-gradient-to-r from-yellow-900/40 to-slate-900 transition group-hover:from-yellow-900/60"></div>
            <div class="relative flex justify-between items-center">
                <div>
                    <div class="text-yellow-400 font-bold text-sm mb-0.5 flex items-center gap-2">
                        <span>💎</span> Hacete Premium
                    </div>
                    <div class="text-[10px] text-yellow-200/70 leading-tight">
                        Sin publicidad, alertas y más.
                    </div>
                </div>
                <div class="bg-yellow-500 text-slate-900 text-xs font-bold px-3 py-1.5 rounded-lg shadow-lg group-hover:bg-yellow-400 transition">
                    VER
                </div>
            </div>
        </button>
        {% endif %}

        <div>
            <div class="text-[10px] font-bold text-gray-500 uppercase tracking-wider mb-2 px-1 mt-2">Aplicación</div>
            <div class="space-y-2">
                <button onclick="openModal('installModal')" class="w-full flex items-center gap-3 p-3 bg-slate-800/50 hover:bg-slate-800 border border-slate-700/50 hover:border-green-500/30 rounded-xl transition group text-left">
                    <div class="w-8 h-8 rounded-lg bg-green-900/20 flex items-center justify-center text-lg group-hover:scale-110 transition-transform">📲</div>
                    <div class="flex-1">
                        <div class="text-sm font-bold text-gray-200 group-hover:text-green-400">Instalar App</div>
                        <div class="text-[10px] text-gray-500">Para mejor rendimiento</div>
                    </div>
                </button>

                <button onclick="openModal('faqModal')" class="w-full flex items-center gap-3 p-3 bg-slate-800/50 hover:bg-slate-800 border border-slate-700/50 hover:border-purple-500/30 rounded-xl transition group text-left">
                    <div class="w-8 h-8 rounded-lg bg-purple-900/20 flex items-center justify-center text-lg group-hover:scale-110 transition-transform">❓</div>
                    <div class="flex-1">
                        <div class="text-sm font-bold text-gray-200 group-hover:text-purple-400">Ayuda</div>
                        <div class="text-[10px] text-gray-500">Preguntas Frecuentes</div>
                    </div>
                </button>

                <button onclick="openModal('termsModal')" class="w-full flex items-center gap-3 p-3 bg-slate-800/50 hover:bg-slate-800 border border-slate-700/50 hover:border-slate-500/30 rounded-xl transition group text-left">
                    <div class="w-8 h-8 rounded-lg bg-slate-700/30 flex items-center justify-center text-lg group-hover:scale-110 transition-transform">⚖️</div>
                    <div class="flex-1">
                        <div class="text-sm font-bold text-gray-200">Legales</div>
                        <div class="text-[10px] text-gray-500">Términos y condiciones</div>
                    </div>
                </button>
            </div>
        </div>

    </div>

    <div class="p-3 bg-slate-900 border-t border-slate-800">
        <form action="/logout" method="post" class="block w-full">
            <button type="submit" class="w-full flex items-center justify-center gap-2 p-3 rounded-xl bg-red-900/10 hover:bg-red-900/30 border border-red-900/20 hover:border-red-500/30 text-red-400 hover:text-red-300 text-sm font-bold transition group">
                <span class="group-hover:-translate-x-1 transition-transform">🚪</span> 
                Cerrar Sesión
            </button>
        </form>
    </div>

</aside>
