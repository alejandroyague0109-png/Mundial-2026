<aside class="w-full md:w-64 bg-slate-800 rounded-xl border border-slate-700 sticky top-24 shadow-xl flex flex-col h-[calc(100vh-120px)] overflow-hidden transition-all duration-300">
    
    <div class="p-4 bg-slate-800 border-b border-slate-700 z-10 flex-shrink-0">
        <div class="flex items-center gap-3 mb-2">
            <div class="w-10 h-10 rounded-full bg-gradient-to-br from-yellow-500 to-yellow-700 flex items-center justify-center text-slate-900 font-bold text-lg border border-yellow-400 shadow-md">
                {{ user.nick[0]|upper }}
            </div>
            <div class="overflow-hidden">
                <h3 class="text-white font-bold truncate">{{ user.nick }}</h3>
                <p class="text-[10px] text-gray-400 flex items-center gap-1 truncate">
                    📍 {{ user.province }}
                </p>
            </div>
        </div>

        <div class="flex items-center gap-1 text-xs text-yellow-500 mb-3 bg-slate-900/50 p-1.5 rounded border border-slate-700/50">
            <span>⭐</span> <span class="font-bold">{{ user.reputation }}</span> <span class="text-gray-500 ml-1">Reputación</span>
        </div>

        {% if user.is_premium %}
            <div class="text-xs text-center bg-gradient-to-r from-yellow-900/20 to-yellow-600/20 border border-yellow-700/50 rounded py-1 text-yellow-400 font-bold mb-3 shadow-[0_0_10px_rgba(234,179,8,0.1)]">
                💎 USUARIO PREMIUM
            </div>
        {% endif %}

        <div class="flex gap-2 w-full">
            <button onclick="openModal('quickLoadModal')" class="flex-1 bg-blue-900/30 hover:bg-blue-800 text-blue-300 border border-blue-800 text-xs font-bold py-2 rounded transition flex justify-center items-center gap-2">
                <span>⚡</span> Carga Rápida
            </button>
            
            <button onclick="openModal('quickLoadInfoModal')" class="w-10 bg-slate-700 hover:bg-slate-600 text-gray-300 border border-slate-600 text-xs font-bold py-2 rounded transition flex justify-center items-center">
                ℹ️
            </button>
        </div>
    </div>

    <div class="flex-1 overflow-y-auto custom-scrollbar bg-slate-900/30 p-2 space-y-1">
        
        <div class="px-3 py-2 text-[10px] font-bold text-gray-500 uppercase tracking-wider mb-1">
            Menú Principal
        </div>

        <button onclick="openModal('profileModal')" class="w-full text-left px-3 py-2 rounded hover:bg-slate-700 text-xs text-gray-300 flex items-center gap-2 transition">
            <span>✏️</span> Editar Perfil
        </button>

        {% if user.is_premium %}
            <button onclick="openModal('telegramModal')" class="w-full text-left px-3 py-2 rounded hover:bg-slate-700 text-xs text-blue-400 flex items-center gap-2 transition">
                <span>🔔</span> Notificaciones
            </button>
        {% else %}
            <button onclick="openModal('premiumModal')" class="w-full text-left px-3 py-2 rounded hover:bg-slate-700 text-xs text-gray-500 hover:text-yellow-400 flex items-center justify-between transition group">
                <div class="flex items-center gap-2"><span>🔔</span> Notificaciones</div>
                <span class="text-[10px] border border-gray-600 rounded px-1 group-hover:border-yellow-500 group-hover:text-yellow-400">🔒 PRO</span>
            </button>
        {% endif %}
        
        {% if not user.is_premium %}
        <button onclick="openModal('premiumModal')" class="w-full text-left px-3 py-2 rounded hover:bg-slate-700 text-xs text-yellow-400 flex items-center gap-2 transition">
            <span>💎</span> Hacete Premium
        </button>
        {% endif %}

        <button onclick="openModal('installModal')" class="w-full text-left px-3 py-2 rounded hover:bg-slate-700 text-xs text-green-400 flex items-center gap-2 transition">
            <span>📲</span> Instalar App
        </button>

        <button onclick="openModal('faqModal')" class="w-full text-left px-3 py-2 rounded hover:bg-slate-700 text-xs text-purple-400 flex items-center gap-2 transition">
            <span>❓</span> Preguntas Frecuentes
        </button>

        <button onclick="openModal('termsModal')" class="w-full text-left px-3 py-2 rounded hover:bg-slate-700 text-xs text-gray-400 flex items-center gap-2 transition">
            <span>⚖️</span> Términos y Condiciones
        </button>

    </div>

    <div class="p-2 border-t border-slate-700 bg-slate-800/50">
        <form action="/logout" method="post" class="block w-full">
            <button type="submit" class="w-full text-left px-3 py-2 rounded hover:bg-red-900/30 hover:text-red-300 text-xs text-red-400 flex items-center gap-2 transition font-bold">
                <span>🚪</span> Cerrar Sesión
            </button>
        </form>
    </div>

</aside>
