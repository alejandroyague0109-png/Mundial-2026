<div id="bottom-nav-container" 
     class="fixed bottom-0 left-0 right-0 z-50 bg-slate-950/90 backdrop-blur-md border-t border-slate-800 h-16 shadow-[0_-4px_20px_rgba(0,0,0,0.4)] transition-none will-change-transform"
     x-data="{
        getFlag(code) {
            // Mapeo exhaustivo de TODOS los códigos de tu álbum a códigos ISO 3166-1 alpha-2 (para flagcdn)
            const map = {
                'ARG': 'ar', 'BRA': 'br', 'URU': 'uy', 'ECU': 'ec', 'PAR': 'py', 'COL': 'co', 'VEN': 've',
                'USA': 'us', 'MEX': 'mx', 'CAN': 'ca', 'PAN': 'pa',
                'FRA': 'fr', 'GER': 'de', 'ESP': 'es', 'ENG': 'gb-eng', 'POR': 'pt', 'NED': 'nl', 'BEL': 'be', 'CRO': 'hr', 'SUI': 'ch', 'RCZ': 'cz', 'BYH': 'ba', 'TUR': 'tr', 'SUE': 'se', 'NOR': 'no', 'AUT': 'at',
                'MAR': 'ma', 'SEN': 'sn', 'GHA': 'gh', 'TUN': 'tn', 'SUD': 'za', 'COT': 'ci', 'CAB': 'cv', 'ALG': 'dz', 'RDC': 'cd', 'EGI': 'eg',
                'JPN': 'jp', 'KOR': 'kr', 'AUS': 'au', 'IRN': 'ir', 'KSA': 'sa', 'QAT': 'qa', 'IRK': 'iq', 'JOR': 'jo', 'UZB': 'uz', 'NZE': 'nz',
                'HAI': 'ht', 'ESC': 'gb-sct', 'CUR': 'cw'
            };
            
            // Excepción para Coca-Cola (no es una bandera, devolvemos una imagen transparente o un ícono genérico)
            if (code === 'COCA') {
                return 'data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7'; // Pixel transparente
            }

            // Si está en el mapa lo usamos, sino usamos el fallback de las 2 primeras letras
            const iso = map[code] || code.substring(0, 2).toLowerCase();
            return `https://flagcdn.com/w40/${iso}.png`;
        }
     }">
    
    <div class="flex items-center gap-2 overflow-x-auto h-full px-4 custom-scrollbar-x snap-x snap-mandatory" id="bottom-nav-list">
        
        {% for code, info in album_structure.items() %}
        <button 
            hx-get="/country/{{ code }}" 
            hx-target="#dynamic-content"
            hx-swap="innerHTML"
            onclick="setBottomActive(this)"
            class="bottom-country-btn shrink-0 snap-center flex flex-col items-center justify-center min-w-[4.5rem] h-12 rounded-lg transition-all duration-200 border border-transparent group focus:outline-none
                   {{ 'bg-slate-800 border-slate-700 text-yellow-400' if loop.first else 'text-gray-400 hover:text-gray-200 hover:bg-slate-800/50' }}">
            
            {% if code == 'FWC' %}
                <span class="text-xl leading-none mb-0.5 filter drop-shadow-md group-hover:scale-110 transition-transform">
                    🏆
                </span>
            {% else %}
                <div class="relative w-6 h-4 mb-1 overflow-hidden rounded-[2px] shadow-sm group-hover:scale-110 transition-transform duration-200">
                     <img :src="getFlag('{{ code }}')" 
                          alt="{{ code }}" 
                          class="w-full h-full object-cover"
                          loading="lazy">
                     <div class="absolute inset-0 bg-gradient-to-tr from-black/10 to-white/20"></div>
                </div>
            {% endif %}
            
            <span class="text-[10px] font-bold uppercase tracking-wider truncate max-w-[4rem]">
                {{ info.name[:3] }}
            </span>
            
            <div class="active-dot {{ 'opacity-100' if loop.first else 'opacity-0' }} w-1 h-1 bg-yellow-500 rounded-full mt-0.5 shadow-[0_0_5px_rgba(234,179,8,0.8)] transition-opacity"></div>
        </button>
        {% endfor %}
        
    </div>
</div>

<style>
    .custom-scrollbar-x::-webkit-scrollbar { height: 0px; background: transparent; }
    .custom-scrollbar-x { -ms-overflow-style: none; scrollbar-width: none; }
</style>

<script>
    function setBottomActive(btn) {
        document.querySelectorAll('.bottom-country-btn').forEach(b => {
            b.classList.remove('bg-slate-800', 'border-slate-700', 'text-yellow-400');
            b.classList.add('text-gray-400');
            const dot = b.querySelector('.active-dot');
            if(dot) { dot.classList.remove('opacity-100'); dot.classList.add('opacity-0'); }
            const img = b.querySelector('img');
            if(img) img.classList.add('grayscale', 'opacity-70');
        });

        btn.classList.remove('text-gray-400');
        btn.classList.add('bg-slate-800', 'border-slate-700', 'text-yellow-400');
        
        const dot = btn.querySelector('.active-dot');
        if(dot) { dot.classList.remove('opacity-0'); dot.classList.add('opacity-100'); }
        const img = btn.querySelector('img');
        if(img) img.classList.remove('grayscale', 'opacity-70');

        btn.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
    }

    document.addEventListener('DOMContentLoaded', () => {
        document.querySelectorAll('.bottom-country-btn:not(.text-yellow-400) img').forEach(img => {
            img.classList.add('grayscale', 'opacity-70');
        });

        // --- LÓGICA DE COLISIÓN CON FOOTER ---
        const navBar = document.getElementById('bottom-nav-container');
        const footer = document.querySelector('footer');

        if (navBar && footer) {
            window.addEventListener('scroll', () => {
                // Calculamos dónde empieza el footer relativo a la ventana
                const footerRect = footer.getBoundingClientRect();
                const windowHeight = window.innerHeight;

                // Si el tope del footer entra en la pantalla (es menor al alto de la ventana)
                if (footerRect.top < windowHeight) {
                    // Calculamos cuánto se metió (overlap)
                    const overlap = windowHeight - footerRect.top;
                    // Empujamos la barra hacia arriba esa misma cantidad
                    navBar.style.bottom = `${overlap}px`;
                } else {
                    // Si no, la barra se queda pegada al piso (0px)
                    navBar.style.bottom = '0px';
                }
            }, { passive: true }); // passive: true mejora el rendimiento del scroll
        }
    });
</script>
