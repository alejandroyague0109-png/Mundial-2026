{% extends "base.html" %}

{% block content %}
<div x-data="{ sidebarOpen: false }" class="flex flex-col md:flex-row md:gap-6 items-start min-h-[80vh] relative pb-20">

    <div class="w-full md:hidden mb-4 flex justify-between items-center bg-slate-800 p-3 rounded-lg border border-slate-700 shadow-lg">
        <span class="font-bold text-yellow-400 flex items-center gap-2">
            🏆 <span class="text-white text-sm">Mi Álbum</span>
        </span>
        <button @click="sidebarOpen = !sidebarOpen" 
                class="bg-slate-700 hover:bg-slate-600 text-white px-4 py-2 rounded border border-slate-600 text-sm flex items-center gap-2 transition-colors">
            <span class="text-xs">⚙️</span>
            Menú
        </button>
    </div>

    <aside class="fixed top-0 bottom-0 left-0 z-[60] w-72 bg-slate-900 border-r border-slate-700 transform transition-transform duration-300 ease-in-out 
                  md:translate-x-0 md:block md:w-64 md:bg-transparent md:border-0 
                  md:sticky md:top-24 md:z-30 md:h-[calc(100vh-6rem)]"
           :class="sidebarOpen ? 'translate-x-0 shadow-2xl' : '-translate-x-full'"
           x-cloak>
        
        <div class="h-full overflow-y-auto custom-scrollbar">
            {% include "components/sidebar.html" %}
        </div>
    </aside>

    <div x-show="sidebarOpen" 
         @click="sidebarOpen = false" 
         x-transition.opacity
         class="fixed inset-0 bg-black/80 z-40 md:hidden backdrop-blur-sm">
    </div>

    <main class="flex-1 w-full min-w-0"> 
        
        {% include "partials/stats_bar.html" %}

        <div class="w-full bg-slate-800 border border-slate-700 p-4 rounded-xl mb-6 shadow-lg flex gap-3 items-center animate-fade-in mt-4">
            
            <button onclick="shareOnWhatsApp()" class="flex-1 bg-green-600 hover:bg-green-500 text-white font-bold py-3 rounded-lg shadow-md flex justify-center items-center gap-2 transition transform active:scale-95 group">

                <span>Compartir Wishlist</span>
            </button>

            <button onclick="document.getElementById('wishlistInfoModal').showModal()" class="w-12 h-12 flex-shrink-0 bg-slate-700 hover:bg-slate-600 text-yellow-400 font-bold rounded-lg shadow-md flex justify-center items-center transition border border-slate-600">
                ℹ️
            </button>
        </div>

        <div id="dynamic-content" 
             hx-get="/country/{{ first_country_code }}" 
             hx-trigger="load" 
             hx-swap="innerHTML"
             class="transition-opacity duration-300 min-h-[400px]">
             
             <div class="flex flex-col items-center justify-center pt-20 animate-pulse">
                <div class="w-12 h-12 border-4 border-slate-600 border-t-yellow-400 rounded-full animate-spin mb-4"></div>
                <p class="text-gray-400 text-sm">Entrando a la cancha...</p>
             </div>
        </div>

    </main>
</div>

{% include "components/bottom_nav.html" %}
{% include "components/modals.html" %}

<script>
    // Limpieza de formularios al cerrar modal de carga rápida
    document.body.addEventListener('closeModal', function(evt){
        const modal = document.getElementById('quickLoadModal');
        if (modal) {
            modal.close();
            const form = modal.querySelector('form');
            if(form) form.reset();
        }
    });

    // --- LÓGICA WHATSAPP DEFINITIVA ---
    function shareOnWhatsApp() {
        const container = document.getElementById('dynamic-content');
        if (!container) return;

        // 1. PREFIX
        let prefix = "FIGUS";
        const titleEl = container.querySelector('h2');
        if (titleEl) {
            let text = titleEl.innerText.trim().toUpperCase();
            if (text.includes('/')) text = text.split('/')[0].trim();
            prefix = text.substring(0, 3).replace(/[^A-Z]/g, ""); 
        }

        let wishlist = new Set();
        let repetidas = new Set();

        // 2. BUSCAR
        const stickers = container.querySelectorAll('div[id^="sticker-"]');

        stickers.forEach(el => {
            // A. Obtener Número
            const numSpan = el.querySelector('span.font-mono'); 
            if (!numSpan) return;
            const numero = parseInt(numSpan.innerText.trim());
            if (isNaN(numero)) return;

            // B. LEER ESTADO (Ahora es trivial: leemos el atributo HTML)
            // Si el atributo no existe (ej: carga inicial), usamos el valor por defecto 'falta'
            const currentStatus = el.getAttribute('data-status') || 'falta';

            // C. Clasificar
            if (currentStatus === 'wishlist') {
                wishlist.add(numero);
            } else if (currentStatus === 'repetida') {
                repetidas.add(numero);
            }
        });

        const wList = Array.from(wishlist).sort((a,b) => a - b);
        const rList = Array.from(repetidas).sort((a,b) => a - b);

        // 3. MENSAJE
        let mensaje = `👋 HOLA! Estoy completando el álbum *Canje AlToque 26*.\n`; 
        mensaje += `Viendo: *${prefix}*\n`;
        mensaje += `----------------------------------\n`;

        if (wList.length > 0) {
            mensaje += `❤️ BUSCO (Wishlist):\n`;
            mensaje += wList.map(n => `${n}`).join(', ') + `\n\n`;
        } else {
            mensaje += `✅ BUSCO: ¡Nada en esta página!\n\n`;
        }

        if (rList.length > 0) {
            mensaje += `🔄 TENGO REPES:\n`;
            mensaje += rList.map(n => `${n}`).join(', ') + `\n`;
        } else {
            mensaje += `🚫 REPES: No tengo por ahora.\n`;
        }

        mensaje += `----------------------------------\n`;
        mensaje += `¿Cambiamos? \n\n📲 Generado con CanjeAlToque26`;

        const url = `https://wa.me/?text=${encodeURIComponent(mensaje)}`;
        window.open(url, '_blank');
    }
</script>

<script>
    // 1. DEFINICIÓN DEL COMPONENTE DE FIGURITA (UI OPTIMISTA)
    document.addEventListener('alpine:init', () => {
        Alpine.data('stickerCard', (initialStatus) => ({
            status: initialStatus || 'falta',
            
            // Acción al hacer click
            toggle() {
                // 1. Cambio visual INSTANTÁNEO (Ciclo: Falta -> Tengo -> Repe -> Wishlist -> Falta)
                if (this.status === 'falta') this.status = 'tengo';
                else if (this.status === 'tengo') this.status = 'repetida';
                else if (this.status === 'repetida') this.status = 'wishlist';
                else if (this.status === 'wishlist') this.status = 'falta';
                
                // 2. La petición HTMX se dispara automáticamente por el evento click del HTML
            },

            // Clases dinámicas según el estado
            get classes() {
                const base = "relative flex flex-col items-center justify-center p-2 rounded-lg cursor-pointer transition-all duration-200 shadow-sm border select-none ";
                switch (this.status) {
                    case 'tengo':
                        return base + "bg-blue-600 border-blue-400 text-white shadow-blue-900/50 hover:scale-105";
                    case 'repetida':
                        return base + "bg-gradient-to-br from-yellow-500 to-yellow-600 border-yellow-400 text-white shadow-yellow-900/50 hover:scale-105 ring-2 ring-yellow-400/50";
                    case 'wishlist':
                        return base + "bg-slate-800 border-red-500 text-red-400 shadow-red-900/20 hover:border-red-400 animate-pulse-slow";
                    default: // falta
                        return base + "bg-slate-800/50 border-slate-700 text-slate-500 hover:bg-slate-800 hover:border-slate-600 grayscale opacity-70 hover:opacity-100";
                }
            },
            
            // Indicador visual (badge)
            get badge() {
                if (this.status === 'repetida') return 'REPE';
                if (this.status === 'wishlist') return 'BUSCO';
                if (this.status === 'tengo') return 'TENGO';
                return null;
            }
        }))
    });
</script>
{% endblock %}
